<!DOCTYPE html>
<html lang="pt_BR">
  <head>
    <meta charset="utf-8" />

    <!-- viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- favicon -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <!-- android icons -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="%PUBLIC_URL%/android-chrome-192x192.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="%PUBLIC_URL%/android-chrome-512x512.png"
    />

    <!-- iOS icon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%PUBLIC_URL%/apple-touch-icon.png"
    />

    <!-- PWA -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- mobile app settings -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="A.S.A" />

    <!-- theme -->
    <meta name="theme-color" content="#0f172a" />

    <!-- SEO -->
    <meta
      name="description"
      content="Portal da Associação Santiaguense de Airsoft"
    />

    <!-- OpenGraph (fallback preview) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="A.S.A Airsoft" />
    <meta
      property="og:description"
      content="Portal da Associação Santiaguense de Airsoft"
    />
    <meta property="og:image" content="%PUBLIC_URL%/logo.png" />
    <meta property="og:site_name" content="A.S.A Airsoft" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter preview -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="A.S.A Airsoft" />
    <meta
      name="twitter:description"
      content="Portal da Associação Santiaguense de Airsoft"
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/logo.png" />

    <!-- canonical -->
    <link rel="canonical" href="https://portal-asa.vercel.app" />

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>A.S.A</title>
  </head>

  <body>
    <noscript>
      Você precisa habilitar JavaScript para executar este aplicativo.
    </noscript>

    <div id="root"></div>
  </body>
</html>
